<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter" viewBox="0 40 760 280" role="img" aria-label="A record maps back to a distribution, because some steps cannot be undone" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="inv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"></path></marker><marker id="inv-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a78d6"></path></marker></defs><text  x="24" y="56" font-size="11.5" fill="#5a6170">Forward: the measurement model, from the truth to the recorded pair</text><g  fill="none" stroke="#8a8f98" stroke-width="1.25"><g><path d="M145 96H159" marker-end="url(#inv-arrow)"></path><path d="M257 96H271" marker-end="url(#inv-arrow)"></path><path d="M369 96H383" marker-end="url(#inv-arrow)"></path><path d="M481 96H495" marker-end="url(#inv-arrow)"></path><path d="M593 96H607" marker-end="url(#inv-arrow)"></path></g><g><path d="M145 168H159" marker-end="url(#inv-arrow)"></path><path d="M257 168H271" marker-end="url(#inv-arrow)"></path><path d="M369 168H383" marker-end="url(#inv-arrow)"></path><path d="M481 168H495" marker-end="url(#inv-arrow)"></path><path d="M593 168H607" marker-end="url(#inv-arrow)"></path></g></g><g><rect x="24" y="70" width="120" height="52" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><text x="84" y="93" text-anchor="middle" font-weight="600" fill="#1b2333">True time</text><text x="84" y="109" text-anchor="middle" font-size="11" fill="#5a6170">when it happened</text></g><g><rect x="24" y="142" width="120" height="52" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><text x="84" y="165" text-anchor="middle" font-weight="600" fill="#1b2333">True value</text><text x="84" y="181" text-anchor="middle" font-size="11" fill="#5a6170">what it was</text></g><g><rect x="160" y="70" width="96" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="208" y="93" text-anchor="middle" fill="#1b2333">Delay after</text><text x="208" y="109" text-anchor="middle" fill="#1b2333">its window</text></g><g><rect x="272" y="70" width="96" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="320" y="93" text-anchor="middle" fill="#1b2333">Clock</text><text x="320" y="109" text-anchor="middle" fill="#1b2333">drift</text></g><g><rect x="384" y="70" width="96" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="432" y="93" text-anchor="middle" fill="#1b2333">Correction</text><text x="432" y="109" text-anchor="middle" fill="#1b2333">steps</text></g><g><rect x="496" y="70" width="96" height="52" rx="8" fill="#e8a33d" fill-opacity="0.14" stroke="#e8a33d" stroke-width="1.75"></rect><text x="544" y="93" text-anchor="middle" fill="#1b2333">Stamp</text><text x="544" y="109" text-anchor="middle" fill="#1b2333">grid</text></g><g><rect x="160" y="142" width="96" height="52" rx="8" fill="#e8a33d" fill-opacity="0.14" stroke="#e8a33d" stroke-width="1.75"></rect><text x="208" y="165" text-anchor="middle" fill="#1b2333">Sensor</text><text x="208" y="181" text-anchor="middle" fill="#1b2333">error</text></g><g><rect x="272" y="142" width="96" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="320" y="165" text-anchor="middle" fill="#1b2333">Scale</text><text x="320" y="181" text-anchor="middle" fill="#1b2333">factor</text></g><g><rect x="384" y="142" width="96" height="52" rx="8" fill="#e8a33d" fill-opacity="0.14" stroke="#e8a33d" stroke-width="1.75"></rect><text x="432" y="165" text-anchor="middle" fill="#1b2333">Converter</text><text x="432" y="181" text-anchor="middle" fill="#1b2333">codes</text></g><g><rect x="496" y="142" width="96" height="52" rx="8" fill="#e8a33d" fill-opacity="0.14" stroke="#e8a33d" stroke-width="1.75"></rect><text x="544" y="165" text-anchor="middle" fill="#1b2333">Rounding,</text><text x="544" y="181" text-anchor="middle" fill="#1b2333">heaping</text></g><g><rect x="608" y="70" width="120" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="668" y="93" text-anchor="middle" font-weight="600" fill="#1b2333">Recorded</text><text x="668" y="109" text-anchor="middle" font-weight="600" fill="#1b2333">time stamp</text></g><g><rect x="608" y="142" width="120" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="668" y="165" text-anchor="middle" font-weight="600" fill="#1b2333">Recorded</text><text x="668" y="181" text-anchor="middle" font-weight="600" fill="#1b2333">value</text></g><g fill="none" stroke="#2a78d6" stroke-width="2"><path d="M728 216V232H84V196" marker-end="url(#inv-back)"></path></g><text x="384" y="252" text-anchor="middle" font-size="11.5" fill="#1b2333">Inverse, the atlas: undo the steps whose parameters are measured, and carry the rest</text><text x="384" y="268" text-anchor="middle" font-size="11.5" fill="#1b2333">as a joint distribution over the true time and true value</text><g><rect x="24" y="290" width="18" height="14" rx="3" fill="none" stroke="#8a8f98" stroke-width="1.25"></rect><text x="50" y="301" font-size="11.5" fill="#5a6170">invertible once measured</text><rect x="232" y="290" width="18" height="14" rx="3" fill="#e8a33d" fill-opacity="0.14" stroke="#e8a33d" stroke-width="1.75"></rect><text x="258" y="301" font-size="11.5" fill="#5a6170">many-to-one: leaves an interval or a spread</text></g></svg>